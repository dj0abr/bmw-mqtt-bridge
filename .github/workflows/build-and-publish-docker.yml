name: Build and publish Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Native build and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libmosquitto-dev libcurl4-openssl-dev jq openssl python3 mosquitto
      - name: Compile and run offline tests
        run: |
          bash scripts/compile.sh
          python3 -B -m unittest discover -s tests -v
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

  build:
    name: Container (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            arch: armv7
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: bmw-mqtt-bridge:test
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Check runtime dependencies and startup
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$TEST_PLATFORM" bmw-mqtt-bridge:test bash -ec '
            for dependency in curl jq openssl nano; do
              command -v "$dependency" >/dev/null
            done
            bash -n /app/bmw_flow.sh /app/docker-entrypoint.sh
          '
          set +e
          output=$(docker run --rm --platform "$TEST_PLATFORM" \
            --entrypoint /app/bmw_mqtt_bridge \
            -e XDG_STATE_HOME=/tmp/bmw-empty-state bmw-mqtt-bridge:test 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          [[ "$output" == *"Token directory missing"* ]]

  publish:
    name: Publish multi-platform image
    needs: [test, build]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Publish tested platforms
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker-amd64
            type=gha,scope=docker-arm64
            type=gha,scope=docker-armv7
      - name: Inspect published image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST"
          printf 'Published `%s/%s@%s`\n' "$REGISTRY" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Check anonymous access
        run: |
          if ! curl --fail --silent --show-error --output /tmp/ghcr-anonymous.json \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$IMAGE_NAME:pull"; then
            echo "::warning::Image published, but anonymous access is not available. Set the package visibility to public in GitHub Package settings."
            echo 'First publication: set package visibility to **public** in GitHub Package settings so users can pull without logging in.' >> "$GITHUB_STEP_SUMMARY"
          fi
